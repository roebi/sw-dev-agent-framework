name: Release to PyPI

# Started by publishing a GitHub Release in the web UI, with tag and
# release name "vX.Y.Z" (tag without "v" is accepted too). No commits are
# needed after that: CI gates -> PyPI -> release notes + dists.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: All CI gates (tests, SAST, e2e, container, Trivy, ZAP)
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with pyproject.toml version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          test "${version}" = "${tag}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1; }
      - name: CHANGELOG.md has a section for this version
        run: python3 .github/scripts/changelog_section.py "${GITHUB_REF_NAME}" CHANGELOG.md

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [ci, check-version]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build package
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/sw-dev-agent-framework
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing - no API token needed)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true

  github-release:
    name: Add CHANGELOG notes and dists to the GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Update the published release - CHANGELOG section as notes, attach dists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/changelog_section.py "${GITHUB_REF_NAME}" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
