name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test before release (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=src --cov-fail-under=80 -v

      - name: Run pip-audit
        run: uv run pip-audit

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/sw-dev-agent-framework
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing - no API token needed)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f9c6c2e3ae86b2b2f5f55439f47
        with:
          attestations: true

      - name: Create GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
