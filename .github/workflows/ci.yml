name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Overrides .python-version (3.12) for every uv command in this job;
      # without it `uv run` silently re-creates the venv with 3.12 and no extras.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (incl. [mcp] extra)
        run: uv sync --dev --all-extras

      - name: Verify interpreter matches the matrix
        run: uv run python -c "import sys, mcp; v = '%d.%d' % sys.version_info[:2]; print(v); assert v == '${{ matrix.python-version }}', v"

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80 -v

      - name: Run ruff lint
        run: uv run ruff check src/ tests/ hatch_build.py

      - name: Validate openapi.json (R-CI-001)
        run: uv run openapi-spec-validator src/sw_dev_agent/openapi.json

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Check ascii-safe-text (no em-dashes or en-dashes)
        run: |
          if grep -rn --include="*.py" --include="*.md" --include="*.toml" --include="*.json" --include="*.sh" \
            $'\xe2\x80\x94\|\xe2\x80\x93' src/ tests/ skills/ docs/ *.sh; then
            echo "FAIL: em-dash or en-dash found - use hyphen-minus only"
            exit 1
          fi
          echo "OK: no em-dashes or en-dashes found"

  sast:
    name: SAST (bandit + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Bandit - fail on medium or higher (R-CI-004)
        run: uv run --with bandit bandit -r src hatch_build.py --severity-level medium --confidence-level medium

      - name: Semgrep - fail on WARNING or ERROR (R-CI-004)
        run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/semgrep/semgrep:latest \
            semgrep scan --config p/python --error --severity WARNING --severity ERROR \
            --metrics off src hatch_build.py

  e2e:
    name: E2E - installed wheel (R-CI-003, R-CI-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build sdist and wheel (wheel is built from the sdist)
        run: uv build --out-dir dist

      - name: Install wheel with [mcp] in a clean venv outside the repo
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/e2e"
          VIRTUAL_ENV="$RUNNER_TEMP/e2e" uv pip install "$(ls dist/*.whl)[mcp]"

      - name: Fetch orchestrator and all sub-skills over HTTP, MCP HTTP and MCP stdio
        working-directory: ${{ runner.temp }}
        run: |
          PATH="$RUNNER_TEMP/e2e/bin:$PATH" \
            "$RUNNER_TEMP/e2e/bin/python" -I "$GITHUB_WORKSPACE/tests/e2e/smoke_installed.py"

  container:
    name: Container - build, run, Trivy, ZAP (R-CTR, R-CI-005, R-CI-006)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image twice (reentrancy)
        run: |
          ./podman_build.sh
          ./podman_build.sh

      - name: Run container twice (reentrancy) and wait for healthy
        run: |
          ./podman_run.sh serve
          ./podman_run.sh serve
          for i in $(seq 1 30); do
            if podman healthcheck run sw-dev-agent-serve; then echo healthy; break; fi
            sleep 1
          done
          podman healthcheck run sw-dev-agent-serve
          test "$(podman inspect -f '{{.Config.User}}' sw-dev-agent-serve)" = "10001"

      - name: Smoke test the running container
        run: |
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS http://127.0.0.1:8765/skills/orchestrator | grep -q "name: orchestrate-sw-dev-en"
          ! curl -fsS http://127.0.0.1:8765/version | tee /dev/stderr | grep -q '"unknown"'

      - name: MCP mode starts and is healthy
        run: |
          PORT=8766 ./podman_run.sh mcp
          for i in $(seq 1 30); do
            if podman healthcheck run sw-dev-agent-mcp; then break; fi
            sleep 1
          done
          podman healthcheck run sw-dev-agent-mcp
          podman rm --force sw-dev-agent-mcp

      - name: Trivy image scan - fail on fixable HIGH/CRITICAL (R-CI-005)
        run: |
          podman save -o "$RUNNER_TEMP/image.tar" localhost/sw-dev-agent-framework:latest
          podman run --rm -v "$RUNNER_TEMP:/scan" docker.io/aquasec/trivy:latest \
            image --input /scan/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: OWASP ZAP API scan from openapi.json - fail on medium or higher (R-CI-006)
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          cp src/sw_dev_agent/openapi.json "$RUNNER_TEMP/zap/"
          sed -i 's#"url": "/"#"url": "http://127.0.0.1:8765/"#' "$RUNNER_TEMP/zap/openapi.json"
          podman run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            docker.io/zaproxy/zap-stable:latest \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -J zap-report.json -I
          python3 - "$RUNNER_TEMP/zap/zap-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          alerts = [a for site in report.get("site", []) for a in site.get("alerts", [])]
          bad = [a for a in alerts if int(a.get("riskcode", 0)) >= 2]
          for a in alerts:
              print(f"risk={a.get('riskcode')} {a.get('name')}")
          if bad:
              sys.exit(f"FAIL: {len(bad)} ZAP alert(s) with risk medium or higher")
          print("OK: no medium or higher ZAP alerts")
          PY

      - name: Container logs on failure
        if: failure()
        run: podman logs sw-dev-agent-serve || true
