name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80 -v

      - name: Run ruff lint
        run: uv run ruff check src/ tests/

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Check ascii-safe-text (no em-dashes or en-dashes)
        run: |
          if grep -rn --include="*.py" --include="*.md" --include="*.toml" \
            $'\xe2\x80\x94\|\xe2\x80\x93' src/ tests/ skills/; then
            echo "FAIL: em-dash or en-dash found - use hyphen-minus only"
            exit 1
          fi
          echo "OK: no em-dashes or en-dashes found"
