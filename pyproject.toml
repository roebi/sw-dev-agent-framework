[project]
name = "sw-dev-agent-framework"
version = "0.1.1"
description = "An agentic framework that does exactly one thing: software development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_dev_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sw-dev-agent = "sw_dev_agent.cli:app"
