[project]
name = "sw-dev-agent-framework"
version = "2.0.0"
description = "An agentic framework that does exactly one thing: software development."
readme = "README.md"
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.12"
dependencies = [
    "connexion[uvicorn]>=3.3.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hatchling>=1.33.0",
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "pip>=26.3",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling>=1.33,<1.34"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_dev_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/roebi/sw-dev-agent-framework"
Repository = "https://github.com/roebi/sw-dev-agent-framework"
Changelog = "https://github.com/roebi/sw-dev-agent-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/roebi/sw-dev-agent-framework/issues"

[project.scripts]
sw-dev-agent = "sw_dev_agent.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "hatch_build.py", "README.md", "CHANGELOG.md", "LICENSE", "LICENSES"]
